---
- name: Deploy a Simple Web Application
  hosts: webservers
  become: true  # Runs commands with administrative (sudo) privileges

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Deploy custom HTML index page
      copy:
        content: "<h1>Hello World! App deployed via Ansible.</h1>"
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure Nginx is running and enabled on boot
      service:
        name: nginx
        state: started
        enabled: true
