---
- name: Deploy a Simple Web Application
  hosts: 192.168.18.121
  become: true

  tasks:
    - name: Ensure Nginx is installed
      dnf:
        name: nginx
        state: present

    # NEW TASK: Open port 80 in the firewall
    - name: Allow HTTP traffic through firewall
      firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    # Note: I moved the HTML deployment AFTER the firewall config 
    # just so everything is ready when the files land.
    - name: Deploy custom HTML index page
      copy:
        content: "<h1>Hello World! App deployed via Ansible.</h1>"
        dest: /usr/share/nginx/html/index.html
        owner: nginx
        group: nginx
        mode: '0644'

    - name: Ensure Nginx is running and enabled on boot
      service:
        name: nginx
        state: started
        enabled: true
