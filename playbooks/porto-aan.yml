---
- name: Deploy a Next.js Production Application
  hosts: 192.168.18.121
  become: true

  vars:
    app_dir: "/var/www/aan-porto"
    repo_url: "https://github.com/zannn1019/aan-porto.git"

  tasks:
    - name: Reset default Node.js module stream
      command: dnf module reset nodejs -y
      changed_when: false

    - name: Enable Node.js 20 module stream
      dnf:
        name: "@nodejs:20"
        state: present
        
    - name: Install required packages
      dnf:
        name:
          - nginx
          - nodejs
          - npm
          - git
        state: present

    - name: Check Node.js version
      command: node -v
      register: node_version

    - name: Print Node.js version
      debug:
        msg: "The installed Node version is {{ node_version.stdout }}"

    - name: Install PM2 globally via npm
      command: npm install -g pm2

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: nginx
        group: nginx
        mode: '0755'
        
    - name: Create Safe Directory
      command: "git config --global --add safe.directory {{app_dir}}"
      
    - name: Clone Next.js repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Install npm dependencies
      command: npm install
      args:
        chdir: "{{ app_dir }}"

    - name: Build application
      command: npm run build
      args:
        chdir: "{{ app_dir }}"

    - name: Fix application directory permissions recursively
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: nginx
        group: nginx
        recurse: yes

    - name: Start Next.js app with PM2
      command: "pm2 start ecosystem.config.cjs"
      args:
        chdir: "{{ app_dir }}"
      become_user: nginx
          
    - name: Save PM2 process list
      shell: "pm2 save"
      become_user: nginx
        
    - name: Process list
      shell: "pm2 list"
      become_user: nginx

    - name: Configure Nginx reverse proxy routing
      copy:
        dest: /etc/nginx/conf.d/porto-aan.conf
        content: |
          server {
              listen 80;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }

    - name: Remove default Nginx welcome page
      file:
        path: /usr/share/nginx/html/index.html
        state: absent

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
        enabled: true

    - name: Allow HTTP traffic through firewall
      firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

    - name: Configure SELinux for Nginx networking
      seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
